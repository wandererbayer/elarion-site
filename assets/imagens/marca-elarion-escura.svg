<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="Símbolo de Elarion, fundo claro" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Símbolo de Elarion</title>

  <!-- ===========================================================
       SÍMBOLO DE ELARION

       Três leituras numa forma só:

       1. RPG        — o d20 no centro, em forma cheia.
       2. ESCOLA     — os quatro Pilares de Elarion em volta, que são
                       os quatro territórios do jogo.
       3. ODS/ONU    — o anel segmentado é a gramática visual da Roda
                       dos ODS. Cada arco usa a cor OFICIAL do ODS do
                       território correspondente, então quem conhece a
                       Agenda 2030 reconhece o vínculo de imediato.

       Anel, no sentido horário a partir das 3h:
         laranja  #FD9D24  ODS 11  Cidade-Jardim     (sustentabilidade)
         azul     #00689D  ODS 16  Salão da Justiça  (paz e justiça)
         magenta  #DD1367  ODS 10  Terras Unidas     (desigualdades)
         vermelho #C5192D  ODS 4   Vale do Saber     (educação)

       Tudo é forma cheia e arco grosso: nada de linha fina, para a
       marca continuar legível a 24px na barra e no favicon.
       =========================================================== -->

  <!-- Anel dos quatro Pilares.
       pathLength="100" permite medir cada arco em porcentagem do
       círculo: 21 de traço e 79 de vão, deslocando o início de 25 em
       25 para distribuir os quatro segmentos com folga entre eles. -->
  <g fill="none" stroke-width="16" stroke-linecap="butt" pathLength="100">
    <circle cx="100" cy="100" r="78" stroke="#FD9D24" pathLength="100"
            stroke-dasharray="21 79" stroke-dashoffset="-2"/>
    <circle cx="100" cy="100" r="78" stroke="#00689D" pathLength="100"
            stroke-dasharray="21 79" stroke-dashoffset="-27"/>
    <circle cx="100" cy="100" r="78" stroke="#DD1367" pathLength="100"
            stroke-dasharray="21 79" stroke-dashoffset="-52"/>
    <circle cx="100" cy="100" r="78" stroke="#C5192D" pathLength="100"
            stroke-dasharray="21 79" stroke-dashoffset="-77"/>
  </g>

  <!-- O d20 -->
  <polygon points="100,44 148.5,72 148.5,128 100,156 51.5,128 51.5,72" fill="#15202E"/>

  <!-- Facetas internas -->
  <g fill="none" stroke="#C9A227" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="100,70 127,116 73,116"/>
    <line x1="100" y1="70"  x2="100"   y2="44"/>
    <line x1="73"  y1="116" x2="51.5"  y2="128"/>
    <line x1="127" y1="116" x2="148.5" y2="128"/>
  </g>
</svg>
