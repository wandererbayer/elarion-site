<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200"
     role="img" aria-label="Crônicas de Elarion" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Crônicas de Elarion (fundo claro)</title>

  <!-- ===========================================================
       LOGO COMPLETA — símbolo + nome.

       O símbolo traz o d20 dentro do anel dos quatro Pilares, nas
       cores oficiais dos ODS 4, 10, 11 e 16 (ver marca-elarion.svg).

       O nome é texto de verdade, em Cinzel: sai nítido em qualquer
       tamanho e o acento do "Ô" fica correto. Sem internet a fonte
       cai em Georgia/serif e o desenho segue inteiro. Para entregar
       a quem não tem a fonte, abra no Inkscape e use
       Caminho > Objeto para caminho.
       =========================================================== -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;display=swap');
      .marca-linha {
        font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
        font-weight: 600; font-size: 30px; letter-spacing: 9px; fill: #A8861C;
      }
      .marca-nome {
        font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
        font-weight: 700; font-size: 78px; letter-spacing: 2px; fill: #15202E;
      }
    </style>
  </defs>

  <!-- Anel dos quatro Pilares.
       pathLength="100" permite medir cada arco em porcentagem do
       círculo: 21 de traço e 79 de vão, deslocando o início de 25 em
       25 para distribuir os quatro segmentos com folga entre eles. -->
  <g fill="none" stroke-width="16" stroke-linecap="butt" pathLength="100">
    <circle cx="100" cy="100" r="78" stroke="#FD9D24" pathLength="100"
            stroke-dasharray="21 79" stroke-dashoffset="-2"/>
    <circle cx="100" cy="100" r="78" stroke="#00689D" pathLength="100"
            stroke-dasharray="21 79" stroke-dashoffset="-27"/>
    <circle cx="100" cy="100" r="78" stroke="#DD1367" pathLength="100"
            stroke-dasharray="21 79" stroke-dashoffset="-52"/>
    <circle cx="100" cy="100" r="78" stroke="#C5192D" pathLength="100"
            stroke-dasharray="21 79" stroke-dashoffset="-77"/>
  </g>

  <!-- O d20 -->
  <polygon points="100,44 148.5,72 148.5,128 100,156 51.5,128 51.5,72" fill="#15202E"/>

  <!-- Facetas internas -->
  <g fill="none" stroke="#C9A227" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="100,70 127,116 73,116"/>
    <line x1="100" y1="70"  x2="100"   y2="44"/>
    <line x1="73"  y1="116" x2="51.5"  y2="128"/>
    <line x1="127" y1="116" x2="148.5" y2="128"/>
  </g>

  <text class="marca-linha" x="232" y="80">CRÔNICAS DE</text>
  <text class="marca-nome"  x="230" y="152">ELARION</text>
  <rect x="232" y="170" width="400" height="4" rx="2" fill="#A8861C" opacity="0.5"/>
</svg>
